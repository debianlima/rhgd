projeto: RHGD
nome: Rede Heterogenea Governada e Distribuida
termos:
  RHGD: federacao governada de capacidade computacional e trabalho cognitivo
  WorkUnit: unidade cognitiva semanticamente fechada
  CognitiveResult: resultado estruturado de uma WorkUnit
  RecursiveCognitiveDAG: DAG de decomposicao e reducao recursiva
  HierarchicalReducer: redutor que preserva evidencia, dissenso e proveniencia
  ContextEnvelope: pacote contextual e operacional minimo para uma etapa
  CapabilityAdvertisement: anuncio verificavel de capacidade de um no
  ExecutionQueue: fila runtime de WorkUnit, assignment e lease, exclusivamente PGD
  EnvelopeTransportQueue: fila assimetrica RHGD de transporte de ContextEnvelope,
    separada em ingress/egress e sem autoridade de execucao
  EnvelopeTransportSequence: ordem monotona por lane/peer para envio e recebimento
    de ContextEnvelope
  EnvelopeAck: confirmacao de transporte que autoriza retirada do envelope da fila
    RHGD, sem conceder lease PGD
  PGDExecutionRef: referencia opaca de execucao retornada pelo contrato PGD federation-facing;
    autoriza correlacao de transporte, nao concede lease pelo RHGD
